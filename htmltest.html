<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Color Transition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        input[type="range"] {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
    <input type="range" id="progressSlider" min="0" max="1" step="0.01">
    <script>
        class ColorMaterial {
            constructor(progress) {
                this.uniforms = { uProgress: { value: progress } };
                this.material = new THREE.ShaderMaterial({
                    uniforms: this.uniforms,
                    vertexShader: `
                        varying vec3 vPosition;
                        void main() {
                            vPosition = position;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vPosition;
                        uniform float uProgress;
                        void main() {
                            float mask = step(vPosition.y + 0.5, uProgress); // Define uma borda reta sem desfoque
                            vec3 color = mix(vec3(1.0, 0.0, 0.0), vec3(0.0, 1.0, 0.0), mask);
                            gl_FragColor = vec4(color, 1.0);
                        }
                    `,
                });
            }

            getMaterial() {
                return this.material;
            }
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const colorMaterial = new ColorMaterial(-0.5); //  -0.5 <-> 1.5
        const geometry = new THREE.BoxGeometry(1, 2, 1);
        const cube = new THREE.Mesh(geometry, colorMaterial.getMaterial());
        scene.add(cube);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        document.getElementById('progressSlider').addEventListener('input', (e) => {
            colorMaterial.uniforms.uProgress.value = -0.5 + parseFloat(e.target.value) * 2;
        });
    </script>
</body>

</html>
